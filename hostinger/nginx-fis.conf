# nginx site config for Financial Intelligence Suite on devlabai.tech
#
# Placement: /etc/nginx/sites-available/devlabai.tech
# Then: sudo ln -s /etc/nginx/sites-available/devlabai.tech /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Architecture: this VPS serves the built React app (`dist/`) directly. All
# `/api/*` requests are reverse-proxied to a Vercel project that hosts the 10
# serverless function handlers. The client code keeps issuing relative
# `/api/*` calls — there is no CORS to manage.
#
# IMPORTANT: replace the FIS_API_VERCEL_HOST placeholder below with the actual
# Vercel host you get after `vercel --prod` on the api/ deployment.

upstream fis_api_vercel {
    # Replace with the host returned by your Vercel deploy.
    # Example: fis-api-devlabai.vercel.app
    server FIS_API_VERCEL_HOST:443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name devlabai.tech www.devlabai.tech;

    # Certbot HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devlabai.tech www.devlabai.tech;

    # Certbot-issued certificates (run `sudo certbot --nginx -d devlabai.tech -d www.devlabai.tech`).
    ssl_certificate     /etc/letsencrypt/live/devlabai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devlabai.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Static React build.
    root /var/www/financial-intelligence-suite/dist;
    index index.html;

    # Security headers (mirror vercel.json so behaviour is identical on Hostinger).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Long cache for hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static favicons/icons.
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Reverse proxy /api/* to the Vercel deployment.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass https://fis_api_vercel;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Disable nginx-level caching — each handler manages its own TTL.
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback: every non-asset path resolves to index.html so client-side
    # routing (e.g. /watchlist) works on direct hits and reloads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
