# Configuration Dependabot — absente jusqu'ici, ce qui laissait le comportement
# par défaut : une pull request par avis de sécurité, sans limite ni regroupement.
# Six s'étaient accumulées en douze jours sans être traitées, et le job « Dependabot
# Updates » échouait en boucle en tentant de recréer une PR déjà ouverte.
#
# Deux réglages évitent la récidive :
#  - `groups` rassemble les montées de version en une seule PR par famille, au lieu
#    d'une par paquet. La quasi-totalité des avis de ce dépôt portent sur l'outillage
#    de développement (vite, vitest, esbuild, postcss…), jamais sur ce qui est servi
#    au navigateur : les traiter ensemble est aussi plus sûr, puisque ces paquets
#    montent de version de concert.
#  - `open-pull-requests-limit` borne la file, pour qu'un retard de revue ne se
#    transforme pas en empilement ingérable.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Outillage : build, tests, lint. Rien de tout cela n'atteint le navigateur.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Ce qui est réellement livré à l'utilisateur — groupé aussi, mais séparé,
      # pour qu'une régression visible ne soit jamais noyée dans du bruit d'outillage.
      runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
